<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Abnormality List - Tuantu's Lobotomization Branches VN</title>
    <link rel="stylesheet" href="abnormality-tool.css">
    <link rel="icon" type="image/png" href="TLB.VN.png">
</head>
<body>
<div class="form-panel">
        <h2>Lobotomy Corp - Abnormality Creator</h2>
        <form id="abnormality-form">
            <div class="form-group">
                <label>Subject Classification</label>
                <input type="text" id="in-id" placeholder="X-XX-XXX" required>
            </div>
            <div class="form-group">
                <label>Abnormality Name</label>
                <input type="text" id="in-name" placeholder="Name" required>
            </div>
            <div class="form-group">
                <label>Risk Level</label>
                <select id="in-risk">
                    <option value="ZAYIN">ZAYIN</option>
                    <option value="TETH">TETH</option>
                    <option value="HE">HE</option>
                    <option value="WAW">WAW</option>
                    <option value="ALEPH">ALEPH</option>
                </select>
            </div>
            <div class="form-group">
                <label>Quote</label>
                <input type="text" id="in-quote" placeholder="Quote" required>
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="in-type">
                    <option value="EQUIPPABLE">Equip</option>
                    <option value="CHANNELED">Channeled</option>
                    <option value="SINGLE-USE">Single</option>
                </select>
            </div>
            <div class="form-group">
                <label>Image URL</label>
                <input type="text" id="in-image" placeholder="link ảnh">
            </div>
            <div class="form-group">
                <label>LOG</label>
                <div id="log-inputs-container"></div>
                <button type="button" id="btn-add-log">+ Thêm Log</button>
            </div>
            <div class="form-group">
                <label>METHOD</label>
                <div id="method-inputs-container"></div>
                <button type="button" id="btn-add-method">+ Thêm Method</button>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="in-des" rows="4" placeholder="Nhập mô tả dị thể..."></textarea>
            </div>
            <div class="form-group">
                <label>Appendix List</label>
                <div id="appendix-inputs-container"></div>
                <button type="button" id="btn-add-appendix">+ Thêm Appendix</button>
            </div>
            
            <button type="button" id="btn-save">SAVE</button>
        </form>
    </div>

<div class="preview-panel">
<h3>Preview</h3>
<div class="tool-container-border">
<div class="tool-container">

    <div class="tool-sidebar">
        <div class="tool-img-box">
            <img src="" id="out-image" alt="Tool Abnormality">
        </div>
        <div class="tool-header-info">
            <h2 id="out-name"></h2>
            <div class="tool-sub-info">
                <span id="out-id"></span>
                <span id="out-risk" class="dynamic-risk"></span>
            </div>
        </div>
        <div class="tool-quote" id="out-quote"></div>
        <fieldset class="tool-classification">
            <legend>Type of Abnormality</legend>
            <span class="class-tag" id="out-type"></span>
        </fieldset>

        <div class="modal-trigger-btn-border" onclick="openModal('desc-modal')">
            <div class="modal-trigger-btn">
                <span>DESCRIPTION</span>
            </div>
        </div>

        <div class="modal-trigger-btn-border" onclick="openModal('appendix-modal')">
            <div class="modal-trigger-btn">
                <span>APPENDIX</span>
            </div>
        </div>
    </div>

    <!-- CỘT 2: LOG PANEL -->
    <div class="panel-log-border" id="log-panel">
        <div class="panel-log">
            <div class="panel-header" onclick="togglePanel('log-panel')">
                <span>LOG</span>
            </div>
            <div class="panel-content">
                <div class="log-list">
                    <div class="log-list" id="out-log-list">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="panel-method-border" id="method-panel">
        <div class="panel-method">
            <div class="panel-header" onclick="togglePanel('method-panel')">
                <span>METHOD</span>
            </div>
            <div class="panel-content">
                <div class="method-list" id="out-method-list">
                </div>
            </div>
        </div>
    </div>

</div>
</div>

<div class="custom-modal-overlay" id="desc-modal">
    <div class="custom-modal-box" style="background: none; border: none; box-shadow: none; max-width: 650px; position: relative;">
        <div class="appendix-wrapper" style="position: relative; width: 100%;">
            <div class="desc-container-border">
                <div class="desc-container" style="position: relative;">
                    <div class="Btn-Leave-Corner" onclick="closeModal('desc-modal')">
                        <span>LEAVE</span>
                    </div>

                    <div class="Info-Row" style="border-bottom: 2px solid #ffffa1; margin-bottom: 15px; padding-bottom: 8px; padding-right: 110px;">
                        <span style="font-size: 18px; font-weight: bold; color: #ffffa1;">DESCRIPTION DETAILS</span>
                    </div>

                    <div class="desc-content-body">
                        <p style="color: #ffffa1; font-size: 14px; line-height: 1.6; margin-bottom: 12px;" id="out-des">
                            Mô tả
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<div class="custom-modal-overlay" id="appendix-modal">
    <div class="custom-modal-box" style="background: none; border: none; box-shadow: none; max-width: 650px; position: relative;">
        <div class="appendix-wrapper" style="position: relative; width: 100%;">
            <div class="appendix-container-border">
                <div class="appendix-container" id="out-appendix-container" style="position: relative;">
                    <div class="Btn-Leave-Corner" onclick="closeModal('appendix-modal')">
                        <span>LEAVE</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<script type="module" src="abnormality-tool.js"></script>
</body>
</html>
